[project]
name = "quickapi"
version = "1.0.0"
description = "Ultra-lightweight, zero-dependency Python web framework"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "GPL-3.0" }

[build-system]
requires = ["uv_build>=0.11.12,<0.12.0"]
build-backend = "uv_build"

keywords = ["web", "framework", "api", "http", "routing", "static"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = []

[project.urls]
Homepage = "https://codeberg.org/Enji/quickAPI"
Repository = "https://codeberg.org/Enji/quickAPI"